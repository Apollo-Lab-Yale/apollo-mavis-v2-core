[project]
name = "apollo-xarm7-core"
version = "0.1.0"
description = "Interfaces, schemas, and protocols for the apollo-xarm7 stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "numpy>=1.24,<3",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apollo_xarm7_core"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mujoco".msg = "core must not import mujoco"
"xarm".msg = "core must not import the xArm SDK"
"fastapi".msg = "core must not import fastapi"
"torch".msg = "core must not import torch"
"lerobot".msg = "core must not import lerobot"
"cv2".msg = "core must not import cv2"
"mink".msg = "core must not import mink"
"zmq".msg = "core must not import zmq"
"websockets".msg = "core must not import websockets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
